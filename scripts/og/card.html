<!doctype html>
<!--
  Open Graph card, 1200 × 630. Rendered to public/og.png by scripts/make-og.mjs.
  Uses the site's own fonts, the orange stage and the print grain, so the preview matches the hero.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Fraunces';
        src: url('../../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-full-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'DM Sans';
        src: url('../../node_modules/@fontsource-variable/dm-sans/files/dm-sans-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 1000;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 800;
      }
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        color: #1e140d;
        background: #d9622b;
        font-family: 'DM Sans', sans-serif;
      }
      /* Print grain, only on the empty field to the right (never behind the text) */
      .grain {
        position: absolute;
        inset: 0 0 0 700px;
        background: url('../../public/textures/grain.png') 0 0 / 200px 200px repeat;
        opacity: 0.22;
      }
      /* The hero's marquee name, tone on tone */
      .marquee {
        position: absolute;
        left: -20px;
        top: 360px;
        white-space: nowrap;
        font-family: 'Fraunces', serif;
        font-variation-settings: 'SOFT' 100, 'WONK' 0;
        font-weight: 900;
        font-size: 230px;
        line-height: 1;
        text-transform: uppercase;
        color: #e37a47;
      }
      .text {
        position: absolute;
        left: 72px;
        top: 92px;
        width: 640px;
      }
      .eyebrow {
        font-family: 'JetBrains Mono', monospace;
        font-size: 24px;
        letter-spacing: 0.04em;
        font-weight: 600;
      }
      h1 {
        margin-top: 18px;
        font-family: 'Fraunces', serif;
        font-variation-settings: 'SOFT' 100, 'WONK' 0, 'opsz' 144;
        font-weight: 900;
        font-size: 124px;
        line-height: 0.92;
        letter-spacing: -0.01em;
        padding-bottom: 12px;
        /* Same 70s lettering as the hero: cream letters, deep-brown keyline, mustard and brown offsets */
        color: #f3e6cc;
        text-shadow:
          0.02em 0.02em 0 #1e140d,
          -0.01em -0.01em 0 #1e140d,
          0.05em 0.05em 0 #e0a526,
          0.08em 0.08em 0 #1e140d;
      }
      .tagline {
        margin-top: 18px;
        font-size: 34px;
        font-weight: 500;
        line-height: 1.3;
      }
      .stripes { position: absolute; left: 0; right: 0; bottom: 0; display: grid; gap: 6px; padding-bottom: 28px; }
      .stripes span { display: block; height: 12px; }
      .stripes span:nth-child(1) { background: #1e140d; }
      .stripes span:nth-child(2) { background: #e0a526; }
      .stripes span:nth-child(3) { background: #6e4527; }

      /* A record sliding in from the right edge */
      .record {
        position: absolute;
        width: 560px;
        height: 560px;
        left: 790px;
        top: 20px;
        border-radius: 50%;
        background:
          conic-gradient(from 20deg, transparent 0 18deg, rgb(255 255 255 / 0.14) 40deg, transparent 66deg 196deg, rgb(255 255 255 / 0.09) 220deg, transparent 246deg),
          repeating-radial-gradient(circle, #141110 0 2px, #1d1917 2px 3.4px),
          #141110;
        box-shadow: 0 30px 60px -20px rgb(0 0 0 / 0.7);
      }
      .label {
        position: absolute;
        inset: 33%;
        border-radius: 50%;
        background:
          linear-gradient(transparent 0 56%, #e0a526 56% 63%, #f3e6cc 63% 66%, #3b2314 66% 72%, transparent 72%),
          #d9622b;
        display: grid;
        place-items: center;
      }
      .label b {
        margin-top: -92px;
        font-family: 'Fraunces', serif;
        font-variation-settings: 'SOFT' 100;
        font-weight: 900;
        font-size: 22px;
        letter-spacing: 0.06em;
        color: #fbf4e4;
      }
      .spindle {
        position: absolute;
        left: 50%; top: 50%;
        width: 14px; height: 14px;
        margin: -7px 0 0 -7px;
        border-radius: 50%;
        background: #1e140d;
      }
    </style>
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <div class="marquee" aria-hidden="true">Holden Anderson ● Holden</div>
    <div class="record" aria-hidden="true">
      <div class="label"><b>SIDE A</b></div>
      <div class="spindle"></div>
    </div>
    <div class="text">
      <p class="eyebrow">CS · CSU San Bernardino · May 2027</p>
      <h1>Holden<br />Anderson</h1>
      <p class="tagline">Backend &amp; AI engineer. I like figuring out how things work, then shipping something people use.</p>
    </div>
    <div class="stripes" aria-hidden="true"><span></span><span></span><span></span></div>
  </body>
</html>
